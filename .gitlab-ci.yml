# Minimized from https://about.gitlab.com/2016/10/12/automated-debian-package-build-with-gitlab-ci/
# https://github.com/gitlabhq/gitlabhq/blob/master/vendor/gitlab-ci-yml/C%2B%2B.gitlab-ci.yml

# use the official gcc image, based on debian
# can use verions as well, like gcc:5.2
# see https://hub.docker.com/_/gcc/
#image: gcc

before_script:
  - apt-get update

# Defines stages which are to be executed
stages:
  - build-and-test

run-build-gcc:
  stage: build-and-test
  image: gcc
  script:
    - gcc --version
    - make
    - cd tests && ./RunTests

# It is totally stupid that there is no pre-built image with clang available
# locally -- there isn't even a list of locally available images... so we just
# have to be less efficient.
run-build-clang:
  stage: build-and-test
  image: silkeh/clang
  script:
#   - apt-get install -y clang
    - clang --version
    - CC=clang make
    - cd tests && ./RunTests

